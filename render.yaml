services:
  - type: web
    name: murf-ai
    runtime: python
    plan: free
    branch: feat/render-site
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_MAX_TEXT
        value: "5000"
      - key: WEB_RATE_CHUNKS
        value: "40"
      - key: WEB_RATE_WINDOW
        value: "900"
      - key: WEB_MAX_CONCURRENT
        value: "2"
      - key: WEB_CHUNK_DELAY
        value: "0.15"
